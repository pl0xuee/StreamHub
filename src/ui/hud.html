<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';"
    />
    <title>Grid</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="hud-window">
    <!-- The grid's controls, in a view of their own parked at the top of the window — the one band
         of a video player that is never controls. It exists only while grid mode is on, and it is a
         nub until the pointer arrives on it: a view swallows clicks across its whole rect, so it is
         only ever as big as it is drawn. -->
    <div id="hud" class="hud">
      <div id="hud-nub" class="hud-nub" title="Grid controls"></div>
      <div class="hud-body">
        <div
          id="grid-preview"
          class="grid-preview"
          role="group"
          aria-label="Panes — drag a tile to move it"
        ></div>

        <div id="grid-layout" class="grid-layout" role="group" aria-label="Pane arrangement">
          <button data-layout="auto" title="Packed — fill the space evenly">▦</button>
          <button data-layout="rows" title="Stacked — one above another">▤</button>
          <button data-layout="columns" title="Side by side — one next to another">▥</button>
        </div>

        <p id="grid-hint" class="grid-hint">
          Click a service to add a pane. Drag a tile to move it.
        </p>
      </div>
    </div>

    <script src="hud.js"></script>
  </body>
</html>
